# APK feed for OpenWrt / iStoreOS 25.12+ (apk-tools v3, ADB format).
# Required secret: APK_PRIVATE_KEY_B64  (EC P-256 PEM private key, base64)

name: Build Custom APK Feed (SmartDNS + Passwall)

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '18 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-apk-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl jq python3 gzip openssl

      - name: Install apk-tools
        run: |
          # v3.0.8+ is required (older mkndx has an ADB parsing bug)
          curl -fsSLo /usr/local/bin/apk.static \
            https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v3.0.8/x86_64/apk.static
          chmod +x /usr/local/bin/apk.static
          /usr/local/bin/apk.static --version

      - name: Collect packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public
          cd public

          # passwall luci (official release)
          RELEASE_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall/releases/latest")
          echo "$RELEASE_DATA" | jq -r '.assets[]? | select(.name | endswith(".apk")) | .browser_download_url' | while read -r url; do
            echo "Downloading: $url"
            wget -q -c "$url" || exit 1
          done

          # makeself .run packages from CloudRun (passwall cores, sing-box)
          RUN_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/wkccd/CloudRunFilesBuilder/releases/latest")
          fetch_run() {
            url=$(echo "$RUN_DATA" | jq -r --arg p "$1" '.assets[]? | select(.name | test($p)) | .browser_download_url' | head -n1)
            [ -n "$url" ] || { echo "WARN: asset not found: $1"; return 0; }
            echo "Downloading: $url"
            wget -q -O "$2" "$url"
            skip=$(sed -n 's/^skip="\([0-9]*\)"/\1/p' "$2" | head -n1)
            [ -n "$skip" ] || { echo "WARN: bad makeself header: $2"; rm -f "$2"; return 0; }
            tail -n "+$((skip+1))" "$2" | tar xz
            rm -f "$2"
          }
          fetch_run '^25_PassWall_[0-9.]+_x86_64\.run$' pw.run
          fetch_run '^25-sing-box.*x86_64.*\.run$' sb.run
          rm -f install.sh

          # smartdns (upstream release)
          SD_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/pymumu/smartdns/releases/latest")
          echo "$SD_DATA" | jq -r '.assets[]? | select(.name | endswith(".apk")) | select(.name | contains("lite") | not) | select(.name | test("(all-luci-all|x86_64-openwrt-all)\\.apk$")) | .browser_download_url' | while read -r url; do
            echo "Downloading: $url"
            wget -q -c "$url" || exit 1
          done

          ls -la

      # apk fetches $base_url/$name-$version.apk, so filenames must equal
      # the metadata name/version. The index dump is the source of truth.
      - name: Normalize package filenames
        run: |
          cd public
          shopt -s nullglob

          # strip release version prefixes
          for f in 25.12+_*.apk 23.05-24.10_*.apk 22.03-_*.apk; do
            t="${f#*_}"
            [ "$f" = "$t" ] && continue
            if [ -e "$t" ]; then rm -f "$f"; else mv "$f" "$t"; fi
          done

          /usr/local/bin/apk.static mkndx --allow-untrusted --output /tmp/pre.adb ./*.apk
          /usr/local/bin/apk.static adbdump --format json /tmp/pre.adb > /tmp/pre.json
          echo "--- index sample ---"; head -c 300 /tmp/pre.json; echo ""

          python3 <<'EOF'
          import json, os, glob, re
          data = json.load(open('/tmp/pre.json'))
          pkgs = data['packages'] if isinstance(data, dict) and 'packages' in data else data
          if isinstance(pkgs, dict): pkgs = [pkgs]

          def parse_size(v):
              if isinstance(v, (int, float)): return int(v)
              if isinstance(v, str):
                  m = re.match(r'^([\d.]+)\s*([KMGTP]?)(i?B?)$', v.strip(), re.I)
                  if m:
                      n = float(m.group(1)); u = (m.group(2) or '').upper()
                      return int(n * {'': 1, 'K': 1024, 'M': 1024**2, 'G': 1024**3, 'T': 1024**4}[u])
              return None

          files = {f: os.path.getsize(f) for f in glob.glob('*.apk')}
          renamed, missing = [], []
          for p in pkgs:
              name, ver = p.get('name'), p.get('version')
              if not name or not ver:
                  print('WARN: index entry without name/version'); continue
              target = f'{name}-{ver}.apk'
              if target in files:
                  continue
              size = parse_size(p.get('file-size'))
              cands = [f for f, sz in files.items() if size is not None and sz == size]
              if len(cands) > 1:
                  nm = re.sub(r'[^a-z0-9]', '', name.lower())
                  cands.sort(key=lambda f: (nm not in re.sub(r'[^a-z0-9]', '', f.lower()), len(f)))
              if not cands:
                  missing.append(f'{target} (size={size})'); continue
              src = cands[0]
              os.replace(src, target)
              files.pop(src); files[target] = size
              renamed.append(f'{src} -> {target}')
              print(f'MV {src} -> {target}')

          expected = {f'{p["name"]}-{p["version"]}.apk' for p in pkgs if p.get('name') and p.get('version')}
          leftover = [f for f in glob.glob('*.apk') if f not in expected]
          print(f'=== index entries: {len(pkgs)}, renamed: {len(renamed)}, leftover: {len(leftover)} ===')
          if missing:
              print('MISSING (no local file matched):')
              for m in missing: print('  ' + m)
          if leftover:
              print('leftover files (not matching any index entry):')
              for f in leftover: print('  ' + f)
          EOF
          ls -la

      - name: Fetch adguardhome zh-cn i18n
        continue-on-error: true
        run: |
          cd public
          LIST=$(curl -fsSL --max-time 60 "https://downloads.openwrt.org/snapshots/packages/x86_64/luci/" || true)
          FN=$(echo "$LIST" | grep -oE 'luci-i18n-adguardhome-zh-cn-[0-9][^"<> ]*\.apk' | head -n1)
          if [ -n "$FN" ]; then
            curl -fsSL --max-time 120 -o "$FN" "https://downloads.openwrt.org/snapshots/packages/x86_64/luci/$FN" || true
            ls -la luci-i18n-adguardhome-zh-cn*.apk || true
          else
            echo "not found in snapshot feed, skipped"
          fi

      - name: Sign and build index
        env:
          APK_PRIVATE_KEY_B64: ${{ secrets.APK_PRIVATE_KEY_B64 }}
        run: |
          if [ -z "$APK_PRIVATE_KEY_B64" ]; then
            echo "ERROR: secret APK_PRIVATE_KEY_B64 is not set"
            exit 1
          fi
          echo "$APK_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 -d > /tmp/private-key.pem
          chmod 600 /tmp/private-key.pem
          openssl ec -in /tmp/private-key.pem -pubout -out public-key.pem 2>/dev/null

          cd public
          mkdir -p /tmp/keys && cp ../public-key.pem /tmp/keys/
          /usr/local/bin/apk.static mkndx \
            --allow-untrusted \
            --sign-key /tmp/private-key.pem \
            --description "custom feed $(date +%F)" \
            --output packages.adb \
            ./*.apk
          /usr/local/bin/apk.static verify --keys-dir /tmp/keys packages.adb

          # every index entry must have its name-version.apk on disk
          /usr/local/bin/apk.static adbdump --format json packages.adb > /tmp/idx.json
          jq -r '.packages[] | "\(.name)-\(.version).apk"' /tmp/idx.json > /tmp/want.txt
          echo "--- index entries ---"; cat /tmp/want.txt
          missing=$(while read -r w; do [ -e "$w" ] || echo "$w"; done < /tmp/want.txt)
          if [ -n "$missing" ]; then
            echo "ERROR: index entries without matching file:"
            echo "$missing"
            exit 1
          fi
          echo "OK: all index entries have matching files"

          sha256sum packages.adb *.apk > SHA256SUMS
          rm -f /tmp/private-key.pem

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
